# Configuración del análisis automático de SonarCloud.

# Los nombres de clases, atributos y métodos siguen en camelCase el diagrama UML oficial
# (uml.png): getNombre, costoBase, fechaSalida... Por eso se ignoran las reglas de
# nombres de Python (snake_case) en el código del proyecto.
sonar.issue.ignore.multicriteria=metodos,atributos,parametros

sonar.issue.ignore.multicriteria.metodos.ruleKey=python:S100
sonar.issue.ignore.multicriteria.metodos.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.atributos.ruleKey=python:S116
sonar.issue.ignore.multicriteria.atributos.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.parametros.ruleKey=python:S117
sonar.issue.ignore.multicriteria.parametros.resourceKey=**/*.py
